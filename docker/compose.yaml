# Storefront: a third repo, a third compose file, a third project. It does not
# join `shopnet` — the fetches below run in your browser, not in a container.

name: shop-storefront

services:
  storefront-web:
    build:
      context: ..
      dockerfile: docker/storefront-web.dev.Dockerfile
    image: shop-storefront-web:dev
    ports:
      - "5173:5173"
    environment:
      # Host addresses, because the browser resolves these, not Docker.
      VITE_CATALOG_URL: "http://localhost:5101"
      VITE_ORDERS_URL: "http://localhost:5102"
    volumes:
      # Only the code you edit. node_modules and the config stay in the image.
      - ../src/src:/app/src
