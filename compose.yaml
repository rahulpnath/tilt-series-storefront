name: shop-storefront

services:
  storefront-web:
    build:
      context: ${STOREFRONT_DIR:-.}
      dockerfile: storefront-web.dev.Dockerfile
    environment:
      VITE_CATALOG_URL: "https://catalog.localhost"
      VITE_ORDERS_URL: "https://orders.localhost"
    volumes:
      - ${STOREFRONT_DIR:-.}/src/src:/app/src
    networks:
      default:
      shopnet:
        aliases:
          - storefront-web

# Caddy's network; it reaches this app by its alias.
networks:
  shopnet:
    external: true
