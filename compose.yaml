name: shop-storefront

services:
  storefront-web:
    build:
      context: .
      dockerfile: storefront-web.dev.Dockerfile
    environment:
      VITE_CATALOG_URL: "https://catalog-${FOLDER:-main}.localhost"
      VITE_ORDERS_URL: "https://orders-${FOLDER:-main}.localhost"
    volumes:
      - ./src/src:/app/src
    networks:
      default:
      shopnet:
        aliases:
          - storefront-web-${FOLDER:-main}

# Caddy's network; it reaches this app by its alias.
networks:
  shopnet:
    external: true
