name: shop-storefront

services:
  web:
    build:
      context: .
      dockerfile: storefront-web.dev.Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_CATALOG_URL: "https://catalog.localhost"
      VITE_ORDERS_URL: "https://orders.localhost"
    volumes:
      - ./src/src:/app/src
    networks:
      default:
      shopnet:
        aliases:
          - storefront-web

# Owned by the workspace's infra project; Caddy reaches this app through it.
networks:
  shopnet:
    external: true
